[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "policypilot"
version = "0.1.0"
description = "A local, fixture-driven firewall for AI-agent tool use"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["policypilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "property: property-based invariant tests",
  "fuzz: parser fuzz tests",
  "failure: failure-mode tests",
  "integration: API and persistence integration tests",
]
